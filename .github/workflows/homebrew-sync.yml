name: Homebrew Formula Sync

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          # Strip leading 'v' from tag name (e.g. v0.75.9 → 0.75.9)
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Get sdist URL and SHA256 from PyPI
        run: |
          curl -fsSL "https://pypi.org/pypi/osxphotos/${VERSION}/json" -o pypi.json
          URL=$(jq -r '.urls[] | select(.packagetype == "sdist") | .url' pypi.json)
          SHA256=$(jq -r '.urls[] | select(.packagetype == "sdist") | .digests.sha256' pypi.json)
          test -n "$URL" && test -n "$SHA256"
          echo "URL=${URL}" >> $GITHUB_ENV
          echo "SHA256=${SHA256}" >> $GITHUB_ENV

      - name: Checkout Homebrew tap repo
        uses: actions/checkout@v7
        with:
          repository: RhetTbull/homebrew-osxphotos
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # Only bump url and sha256 in the tap's formula; the rest of the formula
      # (e.g. preserve_rpath) is maintained in the tap and must not be overwritten.
      - name: Update formula in tap
        run: |
          FORMULA=homebrew-tap/Formula/osxphotos.rb
          sed -i -E "s|^  url \".*\"$|  url \"${URL}\"|" "$FORMULA"
          sed -i -E "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" "$FORMULA"
          grep -qF "url \"${URL}\"" "$FORMULA"
          grep -qF "sha256 \"${SHA256}\"" "$FORMULA"

      - name: Commit and push formula update
        run: |
          cd homebrew-tap
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/osxphotos.rb
          git commit -m "Update osxphotos formula to ${VERSION}"
          git push
